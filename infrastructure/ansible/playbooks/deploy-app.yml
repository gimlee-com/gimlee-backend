- name: Deploy Gimlee API
  hosts: app
  become: true
  vars:
    # We default to 'master' but will override this on the command line
    image_tag: "master"
    # Target environment profile (e.g., test, prod)
    spring_profile: "test"
    mongodb_uri: "mongodb://{{ mongodb_user }}:{{ mongodb_password | urlencode }}@{{ hostvars['db1']['ansible_host'] }}:27017/gimlee?authSource=admin"
    piratechain_rpc: "http://{{ hostvars['wallet1']['ansible_host'] }}:45453"
    ycash_rpc: "http://{{ hostvars['wallet1']['ansible_host'] }}:{{ ycash_rpc_port | default(19232) }}"
  tasks:
    - name: Validate JWT key length
      ansible.builtin.assert:
        that:
          - jwt_key is defined
          - jwt_key | length >= 32
        fail_msg: "jwt_key must be at least 32 characters long for HMAC-256 signing (currently {{ jwt_key | default('') | length }} characters)."

    - name: Validate Redis configuration when chat_sse_transport is redis
      ansible.builtin.assert:
        that:
          - redis_password is defined
          - redis_password | length > 0
        fail_msg: "redis_password must be defined (in inventory.ini or --extra-vars) when chat_sse_transport=redis."
      when: (chat_sse_transport | default('in-process')) == 'redis'

    - name: Verify Redis is reachable when chat_sse_transport is redis
      ansible.builtin.wait_for:
        host: "{{ redis_host | default(hostvars['db1']['ansible_host']) }}"
        port: "{{ redis_port | default(6379) }}"
        timeout: 5
        msg: "Redis is not reachable on {{ redis_host | default(hostvars['db1']['ansible_host']) }}:{{ redis_port | default(6379) }}. Ensure Redis has been deployed on the db node via 'ansible-playbook -i ../inventory.ini deploy-redis.yml' before deploying the application with Redis transport enabled."
      when: (chat_sse_transport | default('in-process')) == 'redis'
      check_mode: false

    - name: Run Gimlee API container from pre-built image
      community.docker.docker_container:
        name: gimlee-api
        # This tells Ansible which image to run, e.g., ghcr.io/your-user/gimlee-backend:master
        image: "ghcr.io/gimlee-com/gimlee-backend:{{ image_tag }}"
        pull: true
        restart_policy: always
        ports:
          - "12060:12060"
        env:
          SPRING_PROFILES_ACTIVE: "{{ spring_profile }}"
          SPRING_DATA_MONGODB_URI: "{{ mongodb_uri }}"
          GIMLEE_PAYMENTS_PIRATE_CHAIN_CLIENT_RPC_URL: "{{ piratechain_rpc }}"
          GIMLEE_PAYMENTS_PIRATE_CHAIN_CLIENT_USER: "{{ piratechain_user }}"
          GIMLEE_PAYMENTS_PIRATE_CHAIN_CLIENT_PASSWORD: "{{ piratechain_password }}"
          GIMLEE_PAYMENTS_YCASH_CLIENT_RPC_URL: "{{ ycash_rpc }}"
          GIMLEE_PAYMENTS_YCASH_CLIENT_USER: "{{ ycash_user }}"
          GIMLEE_PAYMENTS_YCASH_CLIENT_PASSWORD: "{{ ycash_password }}"
          SPRING_MAIL_HOST: "{{ mail_host }}"
          SPRING_MAIL_PORT: "{{ mail_port }}"
          SPRING_MAIL_USERNAME: "{{ mail_username }}"
          SPRING_MAIL_PASSWORD: "{{ mail_password }}"
          GIMLEE_AUTH_REST_JWT_KEY: "{{ jwt_key }}"
          GIMLEE_MEDIA_STORE_STORAGE_TYPE: "S3"
          GIMLEE_MEDIA_STORE_S3_ENDPOINT: "{{ s3_endpoint }}"
          GIMLEE_MEDIA_STORE_S3_REGION: "{{ s3_region }}"
          GIMLEE_MEDIA_STORE_S3_BUCKET: "{{ s3_bucket_name }}"
          GIMLEE_MEDIA_STORE_S3_ACCESS_KEY: "{{ s3_access_key }}"
          GIMLEE_MEDIA_STORE_S3_SECRET_KEY: "{{ s3_secret_key }}"
          GIMLEE_PAYMENTS_EXCHANGE_OPEN_EXCHANGE_RATES_APP_ID: "{{ openexchangerates_app_id }}"
          # Chat real-time SSE fan-out. Defaults to in-process; set chat_sse_transport=redis
          # (with Redis deployed via deploy-redis.yml) when running more than one app node.
          # See docs/adr/0005-real-time-chat-horizontal-scaling.md.
          GIMLEE_CHAT_SSE_TRANSPORT: "{{ chat_sse_transport | default('in-process') }}"
          SPRING_DATA_REDIS_HOST: "{{ redis_host | default(hostvars['db1']['ansible_host']) }}"
          SPRING_DATA_REDIS_PORT: "6379"
          SPRING_DATA_REDIS_PASSWORD: "{{ redis_password | default('') }}"
        labels:
          traefik.enable: "true"
          # Create the main router for HTTPS on port 443 (websecure)
          traefik.http.routers.gimlee-secure.rule: "Host(`{{ domain }}`)"
          traefik.http.routers.gimlee-secure.entrypoints: "websecure"
          traefik.http.routers.gimlee-secure.tls: "true"
          traefik.http.routers.gimlee-secure.tls.certresolver: "myresolver"
          traefik.http.routers.gimlee-secure.service: "gimlee-service"

          # Define the service that points to the application port
          traefik.http.services.gimlee-service.loadbalancer.server.port: "12060"

          # CORS Middleware definition
          traefik.http.middlewares.gimlee-cors.headers.accesscontrolallowmethods: "GET,OPTIONS,PUT,POST,DELETE,PATCH"
          traefik.http.middlewares.gimlee-cors.headers.accesscontrolalloworiginlist: "{{ cors_allowed_origins | default('https://gimlee.com,https://staging.gimlee.com') }}"
          traefik.http.middlewares.gimlee-cors.headers.accesscontrolallowheaders: "Content-Type,Authorization,X-CSRF-TOKEN,*"
          traefik.http.middlewares.gimlee-cors.headers.accesscontrolmaxage: "100"

          # Rate Limit Middleware for token refresh endpoint (10 req/min per IP)
          traefik.http.middlewares.refresh-rate-limit.ratelimit.average: "10"
          traefik.http.middlewares.refresh-rate-limit.ratelimit.period: "1m"
          traefik.http.middlewares.refresh-rate-limit.ratelimit.burst: "15"
          traefik.http.middlewares.refresh-rate-limit.ratelimit.sourcecriterion.ipstrategy.depth: "1"

          # Router for rate-limited refresh endpoint
          traefik.http.routers.gimlee-refresh.rule: "Host(`{{ domain }}`) && Path(`/api/auth/token/refresh`)"
          traefik.http.routers.gimlee-refresh.entrypoints: "websecure"
          traefik.http.routers.gimlee-refresh.tls: "true"
          traefik.http.routers.gimlee-refresh.tls.certresolver: "myresolver"
          traefik.http.routers.gimlee-refresh.service: "gimlee-service"
          traefik.http.routers.gimlee-refresh.middlewares: "gimlee-cors,refresh-rate-limit"
          traefik.http.routers.gimlee-refresh.priority: "100"

          # Attach middleware to the main router
          traefik.http.routers.gimlee-secure.middlewares: "gimlee-cors"

